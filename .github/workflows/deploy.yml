name: Deploy to Hostinger
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hostinger-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build browser assets
        run: npm ci && npm run build && npm run check && node --test tests/session-client.test.mjs
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, mbstring, fileinfo, zip
          coverage: none
      - name: Check PHP syntax
        run: find app bin public vendor -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Test roles and approvals with isolated SQLite database
        run: python3 tests/run-roles-tests.py
      - name: Upload and deploy
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          : "${SSH_HOST:?}" "${SSH_PORT:?}" "${SSH_USER:?}" "${SSH_KEY:?}" "${KNOWN_HOSTS:?}"
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9.-]+$ && "$SSH_USER" =~ ^[a-zA-Z0-9_-]+$ && "$SSH_PORT" =~ ^[0-9]+$ ]]
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hostinger
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/hostinger ~/.ssh/known_hosts
          tar -czf /tmp/bou-release.tar.gz app bin public vendor deploy
          remote=".bou-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh -i ~/.ssh/hostinger -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "mkdir -m 700 '$remote'"
          scp -i ~/.ssh/hostinger -P "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes /tmp/bou-release.tar.gz "$SSH_USER@$SSH_HOST:$remote/release.tar.gz"
          ssh -i ~/.ssh/hostinger -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "set -e; cd '$remote'; tar -xzf release.tar.gz; bash deploy/hostinger.sh .; cd ..; rm -rf '$remote'"


